# Publishes the package to npm when a version tag is pushed.
#
# The tag is pushed by the release script in the development repository, which has already
# run typecheck, tests and a standalone build of this tree. What is left here is proving that
# the published tarball is healthy: the tag matches the manifest, the build succeeds and the
# advertised bin exists.
#
# npm publish gets no token. The package is configured with a trusted publisher, so npm mints
# a short-lived credential from the OIDC token of this workflow and attaches provenance
# automatically. That is why id-token: write is required, and why this must run on a
# GitHub-hosted runner.
name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node.js 24 ships npm 11.5.1 or newer, the floor for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Assert the tag matches the manifest version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Assert the advertised bin exists
        run: test -f dist/bin/h2cv.js
      - run: npm publish
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "npm install -g h2cv@${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
